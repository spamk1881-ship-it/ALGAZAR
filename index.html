<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="img1.jpg">
    <title>Elgazzar Animals - Reptiles</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f12; --card-bg: #141b22; --primary: #2ec4b6; --accent: #ff9f1c;
            --text-light: #f1f5f9; --text-muted: #94a3b8; --border: rgba(255, 255, 255, 0.08);
            --sidebar-bg: #0d131a; --sidebar-hover: #182330; --danger: #ef4444; --edit-color: #3b82f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-light); overflow-x: hidden; padding-bottom: 70px; position: relative; }
        .announcement-bar { background: var(--accent); color: #000; text-align: center; padding: 6px 10px; font-size: 0.75rem; font-weight: 800; position: fixed; top: 0; width: 100%; z-index: 1001; display: flex; align-items: center; justify-content: center; gap: 6px; }
        header { position: fixed; top: 29px; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 8px 5%; background: rgba(11, 15, 18, 0.95); backdrop-filter: blur(12px); z-index: 1000; border-bottom: 1px solid var(--border); }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .menu-toggle-btn { font-size: 1.3rem; color: var(--text-light); cursor: pointer; }
        .logo-container { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .logo-img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }
        .logo-text-box { display: flex; flex-direction: column; line-height: 1.1; }
        .logo-main { font-size: 15px; font-weight: 900; color: #fff; direction: ltr; display: flex; gap: 4px; }
        .logo-main span { color: var(--accent); }
        .logo-sub { font-size: 9px; font-weight: 800; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; direction: ltr; text-align: center; }
        
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .user-auth-btn, .admin-panel-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); color: var(--text-light); padding: 5px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .admin-panel-btn { border-color: var(--accent); color: var(--accent); display: none; }
        .cart-icon-btn { position: relative; cursor: pointer; font-size: 1rem; color: var(--text-light); background: rgba(255,255,255,0.05); width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); }
        .badge-count { position: absolute; top: -4px; right: -4px; background: var(--accent); color: #000; font-size: 0.65rem; font-weight: 900; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        
        #toastContainer { position: fixed; bottom: 80px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: var(--card-bg); color: var(--text-light); border: 1px solid var(--primary); padding: 10px 16px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.4); font-size: 0.82rem; font-weight: 700; }
        
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); z-index: 2500; display: none; }
        .sidebar-overlay.active { display: block; }
        .sidebar { position: fixed; top: 0; right: -300px; width: 280px; height: 100%; background: var(--sidebar-bg); z-index: 3000; transition: 0.4s ease; display: flex; flex-direction: column; border-left: 1px solid var(--border); overflow-y: auto; }
        .sidebar.active { right: 0; }
        .sidebar-profile { padding: 25px 20px 15px; display: flex; flex-direction: column; align-items: center; text-align: center; border-bottom: 1px solid var(--border); position: relative; }
        .sidebar-profile .profile-img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); margin-bottom: 8px; }
        .close-sidebar-btn { position: absolute; top: 12px; left: 12px; font-size: 1.2rem; color: var(--text-muted); cursor: pointer; }
        .sidebar-menu { list-style: none; padding: 10px 0; }
        .sidebar-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; color: var(--text-light); text-decoration: none; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .sidebar-item:hover { background: var(--sidebar-hover); color: var(--accent); }
        .sidebar-item-content { display: flex; align-items: center; gap: 10px; }
        .sidebar-category-header { padding: 6px 20px; font-size: 0.75rem; font-weight: 900; color: var(--accent); background: rgba(255,159,28,0.05); margin-top: 5px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 4000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: var(--card-bg); border: 1px solid var(--border); width: 100%; max-width: 450px; border-radius: 16px; padding: 20px; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-modal-btn { position: absolute; top: 12px; left: 16px; font-size: 1.3rem; color: var(--text-muted); cursor: pointer; }
        .form-group { margin-bottom: 10px; }
        .form-group label { font-size: 0.8rem; font-weight: 700; display: block; margin-bottom: 3px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 9px 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px; color: var(--text-light); outline: none; font-size: 0.85rem; }
        .submit-btn { width: 100%; padding: 10px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; margin-top: 8px; }

        .hero { margin-top: 85px; padding: 25px 15px 15px; text-align: center; }
        .brand-logo-banner { display: inline-flex; flex-direction: column; align-items: center; margin-bottom: 10px; }
        .brand-title-row { font-size: 1.8rem; font-weight: 900; color: #fff; direction: ltr; display: flex; gap: 8px; align-items: center; }
        .brand-title-row span { color: var(--accent); }
        .brand-divider { width: 220px; height: 2px; background: var(--accent); margin: 6px 0; position: relative; display: flex; align-items: center; justify-content: center; }
        .brand-divider i { background: var(--bg-color); padding: 0 8px; color: var(--accent); font-size: 0.9rem; }
        .brand-subtitle { font-size: 0.75rem; font-weight: 800; color: var(--accent); letter-spacing: 4px; text-transform: uppercase; direction: ltr; }

        .top-search-container { width: 100%; max-width: 520px; position: relative; margin: 12px auto 0; }
        .top-search-container input { width: 100%; padding: 11px 40px 11px 15px; background: rgba(20, 27, 34, 0.95); border: 2px solid var(--primary); border-radius: 25px; color: var(--text-light); font-size: 0.9rem; outline: none; }
        .top-search-container i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--primary); }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; padding: 20px 5% 50px; }
        .product-card { background: var(--card-bg); border-radius: 14px; border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .owner-actions { position: absolute; top: 8px; right: 8px; z-index: 10; display: flex; gap: 5px; display: none; }
        .owner-btn { background: rgba(0,0,0,0.7); border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
        .edit-card-btn { color: var(--edit-color); }
        .delete-card-btn { color: var(--danger); }
        .badge { position: absolute; top: 8px; left: 8px; background: var(--accent); color: #000; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 6px; z-index: 10; }
        .img-container { width: 100%; height: 170px; background: #070b0d; display: flex; align-items: center; justify-content: center; padding: 8px; }
        .product-card img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .product-info { padding: 12px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
        .category-tag { font-size: 0.72rem; color: var(--primary); font-weight: 700; }
        .product-title { font-size: 0.95rem; margin: 3px 0; font-weight: 800; }
        .product-price-row { display: flex; align-items: center; justify-content: space-between; margin: 4px 0; font-weight: 900; }
        .price-text { font-size: 1.1rem; color: var(--accent); }
        .product-desc { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }
        .add-cart-btn { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); color: var(--text-light); padding: 7px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 0.75rem; }
        .add-cart-btn:hover { background: var(--primary); color: #000; }

        .cart-modal { position: fixed; top: 0; left: -100%; width: 300px; height: 100%; background: #10161d; z-index: 5000; transition: 0.4s ease; padding: 15px; display: flex; flex-direction: column; }
        .cart-modal.active { left: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
        .close-cart { font-size: 1.4rem; cursor: pointer; color: var(--text-muted); }
        .cart-items { flex-grow: 1; overflow-y: auto; margin: 15px 0; }
        .checkout-btn { width: 100%; padding: 10px; background: #25d366; color: #fff; border: none; border-radius: 6px; font-weight: 800; cursor: pointer; }

        .whatsapp-float { position: fixed; bottom: 70px; left: 15px; background: #25d366; color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; z-index: 1000; text-decoration: none; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--sidebar-bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 6px 0; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 0.7rem; font-weight: 700; cursor: pointer; }
        .nav-item i { font-size: 1.1rem; margin-bottom: 2px; }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body>
    <div id="toastContainer"></div>
    <div class="announcement-bar"><i class="fa-solid fa-bolt"></i><span>شحن لكل المحافظات + استشارات مجانية: 01111210854</span></div>
    
    <header>
        <div class="header-right">
            <div class="menu-toggle-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></div>
            <a href="index.html" class="logo-container">
                <img src="img1.jpg" alt="Logo" class="logo-img">
                <div class="logo-text-box">
                    <div class="logo-main">Elgazzar <span>Animals</span></div>
                    <div class="logo-sub">REPTILES</div>
                </div>
            </a>
        </div>
        <div class="header-actions">
            <button class="user-auth-btn" id="authBtn" onclick="handleAuthBtnClick()"><i class="fa-solid fa-user"></i> <span id="authBtnText">دخول</span></button>
            <button class="admin-panel-btn" id="headerAddBtn" onclick="openAdminModal()"><i class="fa-solid fa-plus-circle"></i> <span>إضافة</span></button>
            <div class="cart-icon-btn" onclick="toggleCart()"><i class="fa-solid fa-cart-shopping"></i><span class="badge-count" id="cartCount">0</span></div>
        </div>
    </header>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <span class="close-sidebar-btn" onclick="toggleSidebar()">&times;</span>
        <div class="sidebar-profile">
            <img src="img1.jpg" alt="Logo" class="profile-img">
            <div style="font-size:1rem; font-weight:900;" id="sidebarUserName">زائر</div>
            <div style="font-size:0.7rem; color:var(--primary);" id="sidebarUserEmail">تسجيل الدخول مطلوب</div>
        </div>
        <ul class="sidebar-menu">
            <a class="sidebar-item" id="sidebarAddProductItem" onclick="openAdminModal(); toggleSidebar();" style="display:none;"><div class="sidebar-item-content"><i class="fa-solid fa-plus-circle" style="color:var(--accent);"></i><span>إضافة منتج جديد</span></div></a>
            <div class="sidebar-category-header">الأقسام</div>
            <a class="sidebar-item" onclick="filterCategory('all'); toggleSidebar();"><div class="sidebar-item-content"><i class="fa-solid fa-border-all"></i><span>عرض الكل</span></div></a>
            <a class="sidebar-item" onclick="filterCategory('السحالي'); toggleSidebar();"><div class="sidebar-item-content"><i class="fa-solid fa-dragon"></i><span>السحالي</span></div></a>
            <a class="sidebar-item" onclick="filterCategory('الثعابين'); toggleSidebar();"><div class="sidebar-item-content"><i class="fa-solid fa-staff-snake"></i><span>الثعابين</span></div></a>
            <a class="sidebar-item" onclick="filterCategory('المفصلية'); toggleSidebar();"><div class="sidebar-item-content"><i class="fa-solid fa-spider"></i><span>المفصلية</span></div></a>
            <a class="sidebar-item" onclick="filterCategory('التجهيزات'); toggleSidebar();"><div class="sidebar-item-content"><i class="fa-solid fa-box-archive"></i><span>التجهيزات</span></div></a>
        </ul>
    </aside>

    <div class="modal-overlay" id="authModalOverlay">
        <div class="modal-box">
            <span class="close-modal-btn" onclick="closeAuthModal()">&times;</span>
            <h2 style="color:var(--primary); margin-bottom:12px; font-size:1.1rem; text-align:center;">🔑 دخول المالك</h2>
            <form onsubmit="handleAuthSubmit(event)">
                <div class="form-group"><label>اسم المستخدم</label><input type="text" id="authUsername" required></div>
                <div class="form-group"><label>كلمة المرور</label><input type="password" id="authPassword" required></div>
                <button type="submit" class="submit-btn">دخول</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="adminModalOverlay">
        <div class="modal-box">
            <span class="close-modal-btn" onclick="closeAdminModal()">&times;</span>
            <h2 id="modalFormTitle" style="color:var(--accent); margin-bottom:12px; font-size:1.1rem;">➕ إضافة منتج</h2>
            <form onsubmit="handleProductSubmit(event)">
                <input type="hidden" id="editProductId">
                <div class="form-group"><label>اسم المنتج</label><input type="text" id="prodTitle" required></div>
                <div class="form-group"><label>السعر</label><input type="number" id="prodPrice" required></div>
                <div class="form-group"><label>القسم</label>
                    <select id="prodCategory">
                        <option value="السحالي">السحالي</option>
                        <option value="الثعابين">الثعابين</option>
                        <option value="المفصلية">المفصلية</option>
                        <option value="التجهيزات">التجهيزات</option>
                    </select>
                </div>
                <div class="form-group"><label>صورة المنتج</label><input type="file" id="prodImgFile" accept="image/*"></div>
                <div class="form-group"><label>الوصف</label><textarea id="prodDesc" rows="2" required></textarea></div>
                <button type="submit" class="submit-btn" id="submitProductBtn">نشر المنتج أونلاين</button>
            </form>
        </div>
    </div>

    <section class="hero">
        <div class="brand-logo-banner">
            <div class="brand-title-row">Elgazzar <span>Animals</span></div>
            <div class="brand-divider"><i class="fa-solid fa-staff-snake"></i></div>
            <div class="brand-subtitle">R E P T I L E S</div>
        </div>
        <div class="top-search-container">
            <input type="text" id="searchInput" placeholder="ابحث..." onkeyup="renderProducts()">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
    </section>

    <section class="products-grid" id="productsGrid"></section>

    <div class="cart-modal" id="cartModal">
        <div class="cart-header">
            <h3 style="color: var(--primary); font-size:1rem;">السلة</h3>
            <span class="close-cart" onclick="toggleCart()">&times;</span>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <button class="checkout-btn" onclick="sendWhatsAppOrder()"><i class="fa-brands fa-whatsapp"></i> إرسال الطلب</button>
        </div>
    </div>

    <a href="https://wa.me/201111210854" class="whatsapp-float" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a>
        <a class="nav-item" id="navAddBtn" onclick="openAdminModal()" style="display:none;"><i class="fa-solid fa-plus-circle"></i><span>إضافة</span></a>
        <a class="nav-item" onclick="toggleCart()"><i class="fa-solid fa-cart-shopping"></i><span>السلة</span></a>
    </nav>

    <script>
        const BIN_ID = "6a6e4f8df5f4af5e29df1079";
        const API_KEY = "$2a$10$2c/DUQivZwNvSVYRQGnlEuElNizwxbVdOLn9eo6M9BiLikV23lYWG";

        const MASTER_ADMIN_USERNAME = "elgazzar";
        let currentAdminPassword = localStorage.getItem('elgazzar_admin_pass') || "ALGAZAR admin01111210854";
        
        let products = [];
        let currentUser = JSON.parse(localStorage.getItem('elgazzar_current_user')) || null;
        let cart = JSON.parse(localStorage.getItem('elgazzar_cart')) || [];
        let currentFilterCategory = 'all';

        window.onload = function() {
            updateUserUI();
            fetchProductsFromCloud();
            updateCartUI();
        };

        function showToast(msg) {
            const c = document.getElementById('toastContainer');
            if(!c) return;
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerHTML = `<span>${msg}</span>`;
            c.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        async function fetchProductsFromCloud() {
            try {
                let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                let data = await response.json();
                products = data.record || [];
                renderProducts();
            } catch (err) {
                console.log("خطأ في جلب البيانات", err);
                showToast("تعذر الاتصال بقاعدة البيانات أونلاين");
            }
        }

        async function saveProductsToCloud() {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(products)
                });
                showToast("تم التحديث أونلاين بنجاح ☁️");
            } catch (err) {
                showToast("فشل الحفظ أونلاين");
            }
        }

        function isUserAuthorized() {
            return currentUser && currentUser.username === MASTER_ADMIN_USERNAME && currentUser.isAdmin === true;
        }

        function updateUserUI() {
            const auth = isUserAuthorized();
            const ownerActionsList = document.querySelectorAll('.owner-actions');
            
            if (currentUser) {
                document.getElementById('authBtnText').innerText = "خروج";
                document.getElementById('sidebarUserName').innerText = currentUser.username;
                document.getElementById('sidebarUserEmail').innerText = auth ? "المالك 👑" : "عضو";
                if(auth) {
                    document.getElementById('headerAddBtn').style.display = 'flex';
                    document.getElementById('navAddBtn').style.display = 'flex';
                    document.getElementById('sidebarAddProductItem').style.display = 'flex';
                    ownerActionsList.forEach(el => el.style.display = 'flex');
                }
            } else {
                document.getElementById('authBtnText').innerText = "دخول";
                document.getElementById('sidebarUserName').innerText = "زائر";
                document.getElementById('sidebarUserEmail').innerText = "تسجيل الدخول مطلوب";
                document.getElementById('headerAddBtn').style.display = 'none';
                document.getElementById('navAddBtn').style.display = 'none';
                document.getElementById('sidebarAddProductItem').style.display = 'none';
                ownerActionsList.forEach(el => el.style.display = 'none');
            }
        }

        function handleAuthBtnClick() {
            if (currentUser) {
                currentUser = null;
                localStorage.removeItem('elgazzar_current_user');
                updateUserUI();
                renderProducts();
                showToast("تم تسجيل الخروج");
            } else {
                document.getElementById('authModalOverlay').classList.add('active');
            }
        }

        function closeAuthModal() { document.getElementById('authModalOverlay').classList.remove('active'); }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const u = document.getElementById('authUsername').value.trim().toLowerCase();
            const p = document.getElementById('authPassword').value;
            if (u === MASTER_ADMIN_USERNAME && p === currentAdminPassword) {
                currentUser = { username: MASTER_ADMIN_USERNAME, isAdmin: true };
                localStorage.setItem('elgazzar_current_user', JSON.stringify(currentUser));
                closeAuthModal();
                updateUserUI();
                renderProducts();
                showToast("أهلاً يا مالك الموقع 👑");
            } else {
                showToast("خطأ في البيانات");
            }
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!grid) return;
            grid.innerHTML = '';
            let list = products;
            if (currentFilterCategory !== 'all') list = list.filter(item => item.category === currentFilterCategory);
            if (q) list = list.filter(item => item.title.toLowerCase().includes(q));

            if (list.length === 0) {
                grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:var(--text-muted);">لا توجد منتجات حالياً</p>';
                return;
            }

            const auth = isUserAuthorized();

            list.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="owner-actions" style="display: ${auth ? 'flex' : 'none'};">
                            <button class="owner-btn edit-card-btn" onclick="openEditModal(${p.id})"><i class="fa-solid fa-pen"></i></button>
                            <button class="owner-btn delete-card-btn" onclick="deleteProduct(${p.id})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                        <span class="badge">معتمد</span>
                        <div class="img-container"><img src="${p.img}" alt="${p.title}"></div>
                        <div class="product-info">
                            <span class="category-tag">${p.category}</span>
                            <h3 class="product-title">${p.title}</h3>
                            <div class="product-price-row"><span class="price-text">${p.price} ج.م</span></div>
                            <p class="product-desc">${p.desc}</p>
                            <button class="add-cart-btn" onclick="addToCart('${p.title}', '${p.img}', ${p.price})"><i class="fa-solid fa-cart-plus"></i> إضافة للسلة</button>
                        </div>
                    </div>
                `;
            });
        }

        function addToCart(title, img, price) {
            cart.push({ title, img, price });
            localStorage.setItem('elgazzar_cart', JSON.stringify(cart));
            updateCartUI();
            showToast("تمت الإضافة للسلة 🛒");
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            const c = document.getElementById('cartItems');
            if(!c) return;
            c.innerHTML = cart.map((item, i) => `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; background:rgba(255,255,255,0.03); padding:6px; border-radius:6px; font-size:0.8rem;">
                    <span>${item.title} (${item.price} ج.م)</span>
                    <button onclick="removeFromCart(${i})" style="background:none; border:none; color:var(--danger); cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        function removeFromCart(i) {
            cart.splice(i, 1);
            localStorage.setItem('elgazzar_cart', JSON.stringify(cart));
            updateCartUI();
        }

        function filterCategory(cat) { currentFilterCategory = cat; renderProducts(); }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('sidebarOverlay').classList.toggle('active'); }
        function toggleCart() { document.getElementById('cartModal').classList.toggle('active'); }
        
        function openAdminModal() {
            if(!isUserAuthorized()) return;
            document.getElementById('editProductId').value = '';
            document.getElementById('prodTitle').value = '';
            document.getElementById('prodPrice').value = '';
            document.getElementById('prodDesc').value = '';
            document.getElementById('prodImgFile').required = true;
            document.getElementById('modalFormTitle').innerText = "➕ إضافة منتج";
            document.getElementById('adminModalOverlay').classList.add('active');
        }

        function openEditModal(id) {
            if(!isUserAuthorized()) return;
            const p = products.find(item => item.id === id);
            if(!p) return;
            document.getElementById('editProductId').value = p.id;
            document.getElementById('prodTitle').value = p.title;
            document.getElementById('prodPrice').value = p.price;
            document.getElementById('prodCategory').value = p.category;
            document.getElementById('prodDesc').value = p.desc;
            document.getElementById('prodImgFile').required = false;
            document.getElementById('modalFormTitle').innerText = "✏️ تعديل المنتج";
            document.getElementById('adminModalOverlay').classList.add('active');
        }

        function closeAdminModal() { document.getElementById('adminModalOverlay').classList.remove('active'); }
        
        function deleteProduct(id) {
            if(!isUserAuthorized()) return;
            if(confirm("هل أنت متأكد من مسح المنتج؟")) {
                products = products.filter(item => item.id !== id);
                saveProductsToCloud();
                renderProducts();
            }
        }

        function handleProductSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editProductId').value;
            const title = document.getElementById('prodTitle').value;
            const price = Number(document.getElementById('prodPrice').value);
            const category = document.getElementById('prodCategory').value;
            const desc = document.getElementById('prodDesc').value;
            const fInput = document.getElementById('prodImgFile');

            const processAndSave = (imgSrc) => {
                if (editId) {
                    const p = products.find(item => item.id == editId);
                    if (p) {
                        p.title = title; p.price = price; p.category = category; p.desc = desc;
                        if(imgSrc) p.img = imgSrc;
                    }
                } else {
                    const newProd = { id: Date.now(), title, price, img: imgSrc || 'img1.jpg', category, desc };
                    products.unshift(newProd);
                }
                saveProductsToCloud();
                closeAdminModal();
                renderProducts();
            };

            if (fInput.files && fInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.src = evt.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_WIDTH = 400;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        processAndSave(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
                reader.readAsDataURL(fInput.files[0]);
            } else {
                processAndSave(null);
            }
        }

        function sendWhatsAppOrder() {
            if(cart.length === 0) { showToast("السلة فارغة"); return; }
            let msg = "طلب جديد:%0A";
            cart.forEach(i => msg += `- ${i.title} (${i.price} ج.م)%0A`);
            window.open(`https://wa.me/201111210854?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
