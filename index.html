<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الجزار أنيمال</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: #0b0f12; color: #f1f5f9; padding-bottom: 70px; }
        header { position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: #0b0f12; border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 1000; }
        .logo { font-size: 1.2rem; font-weight: 900; color: #2ec4b6; }
        .btn-cart, .btn-menu { background: rgba(255,255,255,0.08); border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
        .hero { margin-top: 90px; text-align: center; padding: 20px; }
        .hero h1 { font-size: 1.6rem; color: #ff9f1c; margin-bottom: 10px; }
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; padding: 20px; }
        .card { background: #141b22; padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); text-align: center; }
        .card h3 { font-size: 1rem; margin-bottom: 10px; }
        .card button { background: #2ec4b6; color: #000; border: none; padding: 8px 15px; border-radius: 6px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; }
        /* القائمة الجانبية وسلة الطلبات */
        .sidebar, .cart-drawer { position: fixed; top: 0; width: 280px; height: 100%; background: #10161d; z-index: 2000; transition: 0.3s ease; box-shadow: 0 0 20px rgba(0,0,0,0.5); padding: 20px; display: flex; flex-direction: column; }
        .sidebar { right: -300px; } .sidebar.active { right: 0; }
        .cart-drawer { left: -300px; } .cart-drawer.active { left: 0; }
        .close-btn { font-size: 1.5rem; cursor: pointer; margin-bottom: 20px; display: inline-block; }
        /* شريط التنقل السفلي */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #0d131a; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .nav-item { background: none; border: none; color: #94a3b8; display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
        .nav-item i { font-size: 1.2rem; margin-bottom: 2px; }
        .nav-item:hover, .nav-item.active { color: #ff9f1c; }
    </style>
</head>
<body>

    <header>
        <button class="btn-menu" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
        <div class="logo">الجزار أنيمال</div>
        <button class="btn-cart" onclick="toggleCart()"><i class="fa-solid fa-cart-shopping"></i></button>
    </header>

    <div class="hero">
        <h1>أقوى السلالات والنوادر</h1>
        <p>اختر منتجك وابدأ الطلب فوراً</p>
    </div>

    <div class="products">
        <div class="card">
            <h3>سلحفاة سولكاتا</h3>
            <p>3500 ج.م</p>
            <button onclick="alert('تمت الإضافة للسلة بنجاح!')">إضافة للسلة</button>
        </div>
        <div class="card">
            <h3>ضب ملون فاخر</h3>
            <p>2800 ج.م</p>
            <button onclick="alert('تمت الإضافة للسلة بنجاح!')">إضافة للسلة</button>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <span class="close-btn" onclick="toggleSidebar()">&times; القائمة</span>
        <p style="padding: 10px 0; cursor:pointer;" onclick="alert('قسم الثعابين')">🐍 الثعابين والزواحف</p>
        <p style="padding: 10px 0; cursor:pointer;" onclick="alert('قسم السحالي')">🐉 السحالي والنوادر</p>
    </div>

    <div class="cart-drawer" id="cartDrawer">
        <span class="close-btn" onclick="toggleCart()">&times; السلة</span>
        <p style="color: #94a3b8;">سلة الطلبات فارغة حالياً.</p>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="window.scrollTo(0,0)"><i class="fa-solid fa-house"></i>الرئيسية</button>
        <button class="nav-item" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i>القائمة</button>
        <button class="nav-item" onclick="toggleCart()"><i class="fa-solid fa-cart-shopping"></i>السلة</button>
    </nav>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }
        function toggleCart() {
            document.getElementById('cartDrawer').classList.toggle('active');
        }
    </script>
</body>
</html>
