<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="img1.jpg">
    <title>الجزار أنيمال | Elgazzar Animals</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f12; --card-bg: #141b22; --primary: #2ec4b6; --accent: #ff9f1c;
            --text-light: #f1f5f9; --text-muted: #94a3b8; --border: rgba(255, 255, 255, 0.08);
            --sidebar-bg: #0d131a; --sidebar-hover: #182330; --danger: #ef4444; --negotiable-badge: #10b981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-light); overflow-x: hidden; padding-bottom: 70px; }
        .announcement-bar { background: var(--accent); color: #000; text-align: center; padding: 6px 10px; font-size: 0.75rem; font-weight: 800; position: fixed; top: 0; width: 100%; z-index: 1001; display: flex; align-items: center; justify-content: center; gap: 6px; }
        header { position: fixed; top: 29px; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px 5%; background: rgba(11, 15, 18, 0.95); backdrop-filter: blur(12px); z-index: 1000; border-bottom: 1px solid var(--border); }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .menu-toggle-btn { font-size: 1.4rem; color: var(--text-light); cursor: pointer; }
        .logo-container { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }
        .logo-text { font-size: 19px; font-weight: 900; color: var(--primary); }
        .logo-text span { color: var(--accent); }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .user-auth-btn, .admin-panel-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); color: var(--text-light); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .admin-panel-btn { border-color: var(--accent); color: var(--accent); display: none; }
        .cart-icon-btn, .fav-icon-btn, .chat-icon-btn, .account-icon-btn { position: relative; cursor: pointer; font-size: 1.1rem; color: var(--text-light); background: rgba(255,255,255,0.05); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); }
        .account-icon-btn { display: none; border-color: var(--primary); color: var(--primary); }
        .badge-count { position: absolute; top: -5px; right: -5px; background: var(--accent); color: #000; font-size: 0.7rem; font-weight: 900; width: 17px; height: 17px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        #toastContainer { position: fixed; bottom: 80px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: var(--card-bg); color: var(--text-light); border: 1px solid var(--primary); padding: 12px 20px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 10px; font-size: 0.88rem; font-weight: 700; }
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); z-index: 2500; display: none; }
        .sidebar-overlay.active { display: block; }
        .sidebar { position: fixed; top: 0; right: -300px; width: 280px; height: 100%; background: var(--sidebar-bg); z-index: 3000; transition: 0.4s ease; display: flex; flex-direction: column; border-left: 1px solid var(--border); overflow-y: auto; }
        .sidebar.active { right: 0; }
        .sidebar-profile { padding: 30px 20px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; border-bottom: 1px solid var(--border); position: relative; }
        .sidebar-profile .profile-img { width: 75px; height: 75px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); margin-bottom: 10px; }
        .close-sidebar-btn { position: absolute; top: 15px; left: 15px; font-size: 1.2rem; color: var(--text-muted); cursor: pointer; }
        .sidebar-menu { list-style: none; padding: 15px 0; }
        .sidebar-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 22px; color: var(--text-light); text-decoration: none; font-size: 0.92rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .sidebar-item:hover { background: var(--sidebar-hover); color: var(--accent); }
        .sidebar-item-content { display: flex; align-items: center; gap: 12px; }
        .sidebar-category-header { padding: 8px 22px; font-size: 0.78rem; font-weight: 900; color: var(--accent); background: rgba(255,159,28,0.05); margin-top: 5px; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 4000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: var(--card-bg); border: 1px solid var(--border); width: 100%; max-width: 480px; border-radius: 20px; padding: 25px; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-modal-btn { position: absolute; top: 15px; left: 20px; font-size: 1.4rem; color: var(--text-muted); cursor: pointer; }
        .form-group { margin-bottom: 12px; }
        .form-group label { font-size: 0.82rem; font-weight: 700; display: block; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 10px; color: var(--text-light); outline: none; font-size: 0.9rem; }
        .submit-btn { width: 100%; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: 10px; font-weight: 900; cursor: pointer; margin-top: 10px; }
        .hero { margin-top: 85px; padding: 35px 20px 20px; text-align: center; }
        .hero h1 { font-size: 2rem; font-weight: 900; }
        .hero h1 span { color: var(--accent); }
        .top-search-container { width: 100%; max-width: 580px; position: relative; margin: 15px auto 0; }
        .top-search-container input { width: 100%; padding: 13px 45px 13px 20px; background: rgba(20, 27, 34, 0.95); border: 2px solid var(--primary); border-radius: 30px; color: var(--text-light); font-size: 0.95rem; outline: none; }
        .top-search-container i { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--primary); }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 25px 5% 60px; }
        .product-card { background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .card-top-btns { position: absolute; top: 10px; left: 10px; z-index: 10; display: flex; gap: 6px; }
        .fav-card-btn, .delete-card-btn { background: rgba(0,0,0,0.6); border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .fav-card-btn.active { color: #ef4444; background: #fff; }
        .delete-card-btn:hover { background: var(--danger); }
        .badge { position: absolute; top: 10px; right: 10px; background: var(--accent); color: #000; font-size: 0.7rem; font-weight: 800; padding: 3px 8px; border-radius: 8px; z-index: 10; }
        .img-container { width: 100%; height: 180px; background: #070b0d; display: flex; align-items: center; justify-content: center; padding: 10px; }
        .product-card img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .product-info { padding: 15px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
        .category-tag { font-size: 0.75rem; color: var(--primary); font-weight: 700; }
        .product-title { font-size: 1rem; margin: 4px 0; font-weight: 800; }
        .product-price-row { display: flex; align-items: center; justify-content: space-between; margin: 6px 0; font-weight: 900; }
        .price-text { font-size: 1.15rem; color: var(--accent); }
        .product-desc { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 10px; }
        .add-cart-btn { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); color: var(--text-light); padding: 8px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.78rem; }
        .add-cart-btn:hover { background: var(--primary); color: #000; }
        .cart-modal { position: fixed; top: 0; left: -100%; width: 320px; height: 100%; background: #10161d; z-index: 5000; transition: 0.4s ease; padding: 20px; display: flex; flex-direction: column; }
        .cart-modal.active { left: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .close-cart { font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }
        .cart-items { flex-grow: 1; overflow-y: auto; margin: 20px 0; }
        .checkout-btn { width: 100%; padding: 12px; background: #25d366; color: #fff; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; }
        .whatsapp-float { position: fixed; bottom: 75px; left: 20px; background: #25d366; color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; z-index: 1000; text-decoration: none; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--sidebar-bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 0.72rem; font-weight: 700; cursor: pointer; }
        .nav-item i { font-size: 1.2rem; margin-bottom: 2px; }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body>
    <div id="toastContainer"></div>
    <div class="announcement-bar"><i class="fa-solid fa-bolt"></i><span>شحن لكل المحافظات + استشارات مجانية: 01111210854</span></div>
    <header>
        <div class="header-right">
            <div class="menu-toggle-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></div>
            <a href="#" class="logo-container">
                <img src="img1.jpg" alt="Logo" class="logo-img" id="headerLogoImg">
                <div class="logo-text">الجزار <span>أنيمال</span></div>
            </a>
        </div>
        <div class="header-actions">
            <div class="chat-icon-btn" onclick="openChatModal()"><i class="fa-solid fa-comments"></i></div>
            <div class="account-icon-btn" id="accountIconBtn" onclick="openAccountModal()"><i class="fa-solid fa-id-badge"></i></div>
            <button class="user-auth-btn" id="authBtn" onclick="handleAuthBtnClick()"><i class="fa-solid fa-user"></i> <span id="authBtnText">دخول</span></button>
            <button class="admin-panel-btn" id="headerAddBtn" onclick="openAdminModal()"><i class="fa-solid fa-plus-circle"></i> <span>إضافة</span></button>
            <div class="fav-icon-btn" onclick="filterFavorites()"><i class="fa-solid fa-heart"></i><span class="badge-count" id="favCount">0</span></div>
            <div class="cart-icon-btn" onclick="toggleCart()"><i class="fa-solid fa-cart-shopping"></i><span class="badge-count" id="cartCount">0</span></div>
        </div>
    </header>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <span class="close-sidebar-btn" onclick="toggleSidebar()">&times;</span>
        <div class="sidebar-profile">
            <img src="img1.jpg" alt="Logo" class="profile-img" id="sidebarProfileImg">
            <div style="font-size:1.1rem; font-weight:900;" id="sidebarUserName">زائر</div>
            <div style="font-size:0.75rem; color:var(--primary);" id="sidebarUserEmail">يرجى تسجيل الدخول</div>
        </div>
        <ul class="sidebar-menu">
            <a class="sidebar-item" id="sidebarAccountItem" onclick="openAccountModal(); toggleSidebar();" style="display:none;"><div class="sidebar-item-content"><i class="fa-solid fa-user-gear" style="color:var(--primary);"></i><span>إعدادات حسابي</span></div></a>
            <a class="sidebar-item" id="sidebarAddProductItem" onclick="openAdminModal(); toggleSidebar();" style="display:none;"><div class="sidebar-item-content"><i class="fa-solid fa-plus-circle" style="color:var(--accent);"></i><span>إضافة منتج جديد</span></div></a>
            <div class="sidebar-category-header">الأقسام</div>
            <a class="sidebar-item" onclick="filterCategory('all'); toggleSidebar();"><div class="sidebar-item-content"><i class="fa-solid fa-border-all"></i><span>عرض الكل</span></div></a>
            <a class="sidebar-item" onclick="filterCategory('السحالي'); toggleSidebar();"><div class="sidebar-item-content"><i class="fa-solid fa-dragon"></i><span>السحالي</span></div></a>
            <a class="sidebar-item" onclick="filterCategory('الثعابين'); toggleSidebar();"><div class="sidebar-item-content"><i class="fa-solid fa-staff-snake"></i><span>الثعابين</span></div></a>
        </ul>
    </aside>

    <div class="modal-overlay" id="authModalOverlay">
        <div class="modal-box">
            <span class="close-modal-btn" onclick="closeAuthModal()">&times;</span>
            <h2 id="authTitle" style="color:var(--primary); margin-bottom:15px; font-size:1.2rem; text-align:center;">🔑 تسجيل الدخول</h2>
            <form id="authForm" onsubmit="handleAuthSubmit(event)">
                <div class="form-group"><label>اسم المستخدم</label><input type="text" id="authUsername" required></div>
                <div class="form-group"><label>كلمة المرور</label><input type="password" id="authPassword" required></div>
                <button type="submit" class="submit-btn" id="authSubmitBtn">دخول</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="adminModalOverlay">
        <div class="modal-box">
            <span class="close-modal-btn" onclick="closeAdminModal()">&times;</span>
            <h2 style="color:var(--accent); margin-bottom:15px; font-size:1.2rem;">➕ إضافة منتج</h2>
            <form onsubmit="handleProductSubmit(event)">
                <div class="form-group"><label>اسم المنتج</label><input type="text" id="prodTitle" required></div>
                <div class="form-group"><label>السعر</label><input type="number" id="prodPrice" required></div>
                <div class="form-group"><label>صورة المنتج</label><input type="file" id="prodImgFile" accept="image/*" required></div>
                <div class="form-group"><label>الوصف</label><textarea id="prodDesc" rows="2" required></textarea></div>
                <button type="submit" class="submit-btn">نشر المنتج</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="chatModalOverlay">
        <div class="modal-box">
            <span class="close-modal-btn" onclick="closeChatModal()">&times;</span>
            <h3 style="color:var(--primary); margin-bottom:10px;">💬 الشات</h3>
            <div id="chatMessagesList" style="height: 150px; overflow-y: auto; margin-bottom: 10px; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px;"></div>
            <form onsubmit="handleSendPrivateMessage(event)">
                <div class="form-group"><input type="text" id="chatInputText" placeholder="رسالتك..." required></div>
                <button type="submit" class="submit-btn">إرسال</button>
            </form>
        </div>
    </div>

    <section class="hero">
        <h1>معرض <span>الجزار أنيمال</span></h1>
        <div class="top-search-container">
            <input type="text" id="searchInput" placeholder="ابحث..." onkeyup="renderProducts()">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
    </section>

    <section class="products-grid" id="productsGrid"></section>

    <div class="cart-modal" id="cartModal">
        <div class="cart-header">
            <h3 style="color: var(--primary);">السلة</h3>
            <span class="close-cart" onclick="toggleCart()">&times;</span>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <button class="checkout-btn" onclick="sendWhatsAppOrder()"><i class="fa-brands fa-whatsapp"></i> إرسال الطلب</button>
        </div>
    </div>

    <a href="https://wa.me/201111210854" class="whatsapp-float" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a>
        <a class="nav-item" onclick="toggleSidebar()"><i class="fa-solid fa-layer-group"></i><span>الأقسام</span></a>
        <a class="nav-item" onclick="openChatModal()"><i class="fa-solid fa-comments"></i><span>شات</span></a>
        <a class="nav-item" id="navAddBtn" onclick="openAdminModal()" style="display:none;"><i class="fa-solid fa-plus-circle"></i><span>إضافة</span></a>
        <a class="nav-item" onclick="toggleCart()"><i class="fa-solid fa-cart-shopping"></i><span>السلة</span></a>
    </nav>

    <script>
        const MASTER_ADMIN_USERNAME = "elgazzar";
        const MASTER_ADMIN_PASSWORD = "ALGAZAR admin01111210854";
        let defaultProducts = [
            { id: 1, ownerId: 'elgazzar', title: 'سلحفاة سولكاتا', price: 3500, isNegotiable: true, img: 'img1.jpg', category: 'السحالي', desc: 'سلحفاة أليفة وممتازة.' }
        ];
        let products = JSON.parse(localStorage.getItem('elgazzar_products')) || defaultProducts;
        let registeredUsers = JSON.parse(localStorage.getItem('elgazzar_registered_users')) || [];
        let currentUser = JSON.parse(localStorage.getItem('elgazzar_current_user')) || null;
        let cart = JSON.parse(localStorage.getItem('elgazzar_cart')) || [];
        let favorites = JSON.parse(localStorage.getItem('elgazzar_favs')) || [];
        let chatMessages = JSON.parse(localStorage.getItem('elgazzar_private_chats')) || [{ author: 'المشرف', text: 'أهلاً بكم!' }];
        let currentFilterCategory = 'all';

        window.onload = function() {
            updateUserUI();
            renderProducts();
            updateCartUI();
            updateFavUI();
            renderChatMessages();
        };

        function showToast(msg) {
            const c = document.getElementById('toastContainer');
            if(!c) return;
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerHTML = `<span>${msg}</span>`;
            c.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        function isUserAuthorized() {
            return currentUser && currentUser.username === MASTER_ADMIN_USERNAME && currentUser.isAdmin === true;
        }

        function updateUserUI() {
            const auth = isUserAuthorized();
            if (currentUser) {
                document.getElementById('authBtnText').innerText = "خروج";
                document.getElementById('sidebarUserName').innerText = currentUser.username;
                document.getElementById('sidebarUserEmail').innerText = auth ? "المالك 👑" : "عضو";
                if(auth) {
                    document.getElementById('headerAddBtn').style.display = 'flex';
                    document.getElementById('navAddBtn').style.display = 'flex';
                    document.getElementById('sidebarAddProductItem').style.display = 'flex';
                }
            } else {
                document.getElementById('authBtnText').innerText = "دخول";
                document.getElementById('sidebarUserName').innerText = "زائر";
                document.getElementById('sidebarUserEmail').innerText = "تسجيل الدخول مطلوب";
                document.getElementById('headerAddBtn').style.display = 'none';
                document.getElementById('navAddBtn').style.display = 'none';
                document.getElementById('sidebarAddProductItem').style.display = 'none';
            }
        }

        function handleAuthBtnClick() {
            if (currentUser) {
                currentUser = null;
                localStorage.removeItem('elgazzar_current_user');
                updateUserUI();
                renderProducts();
                showToast("تم تسجيل الخروج");
            } else {
                openAuthModal();
            }
        }

        function openAuthModal() { document.getElementById('authModalOverlay').classList.add('active'); }
        function closeAuthModal() { document.getElementById('authModalOverlay').classList.remove('active'); }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const u = document.getElementById('authUsername').value.trim().toLowerCase();
            const p = document.getElementById('authPassword').value;
            if (u === MASTER_ADMIN_USERNAME && p === MASTER_ADMIN_PASSWORD) {
                currentUser = { username: MASTER_ADMIN_USERNAME, isAdmin: true };
                localStorage.setItem('elgazzar_current_user', JSON.stringify(currentUser));
                closeAuthModal();
                updateUserUI();
                renderProducts();
                showToast("أهلاً يا مالك الموقع 👑");
            } else {
                showToast("خطأ في البيانات");
            }
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!grid) return;
            grid.innerHTML = '';
            let list = products;
            if (currentFilterCategory !== 'all') list = list.filter(item => item.category === currentFilterCategory);
            if (q) list = list.filter(item => item.title.toLowerCase().includes(q));

            if (list.length === 0) {
                grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:var(--text-muted);">لا توجد منتجات</p>';
                return;
            }

            list.forEach(p => {
                const isFav = favorites.includes(p.id) ? 'active' : '';
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="card-top-btns">
                            <button class="fav-card-btn ${isFav}" onclick="toggleFavorite(${p.id}, this)"><i class="fa-solid fa-heart"></i></button>
                        </div>
                        <span class="badge">معتمد</span>
                        <div class="img-container"><img src="${p.img}" alt="${p.title}"></div>
                        <div class="product-info">
                            <span class="category-tag">${p.category}</span>
                            <h3 class="product-title">${p.title}</h3>
                            <div class="product-price-row"><span class="price-text">${p.price} ج.م</span></div>
                            <p class="product-desc">${p.desc}</p>
                            <button class="add-cart-btn" onclick="addToCart('${p.title}', '${p.img}', ${p.price})"><i class="fa-solid fa-cart-plus"></i> إضافة للسلة</button>
                        </div>
                    </div>
                `;
            });
        }

        function toggleFavorite(id, btn) {
            const idx = favorites.indexOf(id);
            if (idx > -1) { favorites.splice(idx, 1); btn.classList.remove('active'); }
            else { favorites.push(id); btn.classList.add('active'); }
            localStorage.setItem('elgazzar_favs', JSON.stringify(favorites));
            updateFavUI();
        }

        function updateFavUI() { document.getElementById('favCount').innerText = favorites.length; }

        function addToCart(title, img, price) {
            cart.push({ title, img, price });
            localStorage.setItem('elgazzar_cart', JSON.stringify(cart));
            updateCartUI();
            showToast("تمت الإضافة للسلة 🛒");
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            const c = document.getElementById('cartItems');
            if(!c) return;
            c.innerHTML = cart.map((item, i) => `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; background:rgba(255,255,255,0.03); padding:6px; border-radius:6px; font-size:0.8rem;">
                    <span>${item.title} (${item.price} ج.م)</span>
                    <button onclick="removeFromCart(${i})" style="background:none; border:none; color:var(--danger); cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        function removeFromCart(i) {
            cart.splice(i, 1);
            localStorage.setItem('elgazzar_cart', JSON.stringify(cart));
            updateCartUI();
        }

        function filterCategory(cat) { currentFilterCategory = cat; renderProducts(); }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('sidebarOverlay').classList.toggle('active'); }
        function toggleCart() { document.getElementById('cartModal').classList.toggle('active'); }
        function openAdminModal() { if(!isUserAuthorized()) { showToast("للمالك فقط"); return; } document.getElementById('adminModalOverlay').classList.add('active'); }
        function closeAdminModal() { document.getElementById('adminModalOverlay').classList.remove('active'); }
        function openChatModal() { document.getElementById('chatModalOverlay').classList.add('active'); }
        function closeChatModal() { document.getElementById('chatModalOverlay').classList.remove('active'); }
        function renderChatMessages() {
            const l = document.getElementById('chatMessagesList');
            if(!l) return;
            l.innerHTML = chatMessages.map(m => `<div><strong>${m.author}:</strong> ${m.text}</div>`).join('');
        }
        function handleSendPrivateMessage(e) {
            e.preventDefault();
            const txt = document.getElementById('chatInputText').value.trim();
            if(!txt) return;
            chatMessages.push({ author: currentUser ? currentUser.username : 'زائر', text: txt });
            localStorage.setItem('elgazzar_private_chats', JSON.stringify(chatMessages));
            document.getElementById('chatInputText').value = '';
            renderChatMessages();
        }
        function handleProductSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('prodTitle').value;
            const price = Number(document.getElementById('prodPrice').value);
            const desc = document.getElementById('prodDesc').value;
            const fInput = document.getElementById('prodImgFile');
            if(fInput.files && fInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    products.push({ id: Date.now(), title, price, img: evt.target.result, category: 'السحالي', desc });
                    localStorage.setItem('elgazzar_products', JSON.stringify(products));
                    closeAdminModal();
                    renderProducts();
                    showToast("تم النشر بنجاح");
                };
                reader.readAsDataURL(fInput.files[0]);
            }
        }
        function sendWhatsAppOrder() {
            if(cart.length === 0) { showToast("السلة فارغة"); return; }
            let msg = "طلب جديد:%0A";
            cart.forEach(i => msg += `- ${i.title} (${i.price} ج.م)%0A`);
            window.open(`https://wa.me/201111210854?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
